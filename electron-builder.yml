appId: com.atlas.client.launcher
productName: Atlas Client
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
  # Small PVP kit (forwarder + timer-agent). GraalVM CE 17 downloads on first launch.
  - from: resources/mc-pvp-java17
    to: mc-pvp-java17
  - from: resources/pvp-feel
    to: pvp-feel
  # Wiktor's patched client overlay (hitreg / icons / realtime visuals)
  - from: resources/atlas-client
    to: atlas-client

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Atlas Client.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Atlas Client
  installerSidebar: null
publish:
  provider: github
  owner: WiktorDvD
  repo: lunar-remake1
  releaseType: release
mac:
  target: dmg
linux:
  target: AppImage
