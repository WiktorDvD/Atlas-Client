appId: com.lethalgens.pvp.launcher
productName: LethalGens PvP
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
asar: true
extraResources:
  # Small PVP kit (forwarder + timer-agent). GraalVM CE 17 downloads on first launch.
  - from: resources/mc-pvp-java17
    to: mc-pvp-java17
  - from: resources/pvp-feel
    to: pvp-feel
  # Wiktor's patched client overlay (hitreg / icons / realtime visuals)
  - from: resources/lethalgens-pvp
    to: lethalgens-pvp
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: LethalGensPvP-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LethalGens PvP
  installerSidebar: null
publish:
  provider: github
  owner: WiktorDvD
  repo: lunar-remake1
  releaseType: release
mac:
  target: dmg
linux:
  target: AppImage
